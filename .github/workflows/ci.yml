name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 语法与模块检查
        run: node scripts/verify.mjs

      - name: 平台层自检
        run: node --input-type=module -e "import p from './src/platform.js'; console.log(JSON.stringify(p.summary()))"

      - name: CLI 可用性（list）
        run: node src/index.js list

      - name: 定时设置读取（不写入）
        run: node src/index.js schedule

      - name: 生成配置（幂等）
        run: node src/index.js list

      - name: dry-run（无浏览器环境下跳过平台执行，仅验证不崩溃）
        run: node src/index.js run --dry-run --only=zhipu
        continue-on-error: true
