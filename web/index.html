<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>早八 · 每天 8:30 自动领额度</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="aurora"></div>

    <header class="topbar">
      <div class="brand">
        <div class="logo">签</div>
        <div class="brand-text">
          <h1>早八</h1>
          <p class="sub" id="subline">加载中…</p>
        </div>
      </div>
      <div class="actions">
        <div class="next-run" id="nextRun"></div>
        <button id="btnSchedule" class="btn ghost" title="设置每天自动运行的时间">⏰ <span id="schedLabel">--:--</span></button>
        <button id="btnReport" class="btn ghost" title="查看今日日报">日报</button>
        <button id="btnDry" class="btn ghost" title="只检查不点击">演练</button>
        <button id="btnRunAll" class="btn primary">
          <span class="dot"></span> 全部签到
        </button>
      </div>
    </header>

    <main>
      <section class="summary" id="summary"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>平台</h2>
          <div class="head-actions">
            <div class="seg" id="filterSeg">
              <button class="seg-btn active" data-filter="all">全部</button>
              <button class="seg-btn" data-filter="enabled">仅看启用</button>
            </div>
            <span class="muted" id="platformHint"></span>
          </div>
        </div>
        <div class="grid" id="platforms"></div>
      </section>

      <div class="columns">
        <section class="panel">
          <div class="panel-head">
            <h2>运行日志</h2>
            <div class="head-actions">
              <span class="live" id="liveBadge" hidden>● 实时</span>
              <button class="btn tiny" id="btnClearLog">清空</button>
            </div>
          </div>
          <pre class="log" id="log"><span class="muted">等待运行… 点击「全部签到」或单个平台的「签到」开始</span></pre>
        </section>

        <details class="panel advanced">
          <summary class="panel-head">
            <h2>高级：可接管客户端 <span class="muted" style="font-weight:400">（加新平台时用，日常可忽略）</span></h2>
            <button class="btn tiny" id="btnScanClients">重新扫描</button>
          </summary>
          <p class="hint" style="padding:0 16px 8px">
            这里列的是本机装了、且支持 CDP 调试端口的桌面应用。带「已配置」的才是签到平台真正用到的，其余只是探测信息。
          </p>
          <div id="clients" class="clients"><span class="muted">扫描中…</span></div>
        </details>
      </div>
    </main>

    <footer class="foot">
      <span>数据来自 <code>data/results.jsonl</code> · 只监听 127.0.0.1</span>
      <span id="builtAt"></span>
    </footer>

    <div class="modal" id="scheduleModal">
      <div class="sheet sheet-sm">
        <div class="sheet-head">
          <h2>设置每天运行时间</h2>
          <button class="btn tiny" id="btnCloseSchedule">关闭</button>
        </div>
        <div class="sched-body">
          <label class="field">
            <span>主跑时间</span>
            <input type="time" id="inpTime" step="60" />
          </label>
          <label class="field">
            <span>补跑时间（留空 = 关闭）</span>
            <input type="time" id="inpRetry" step="60" />
          </label>
          <label class="field">
            <span>随机延迟上限（分钟）</span>
            <input type="number" id="inpDelay" min="0" max="120" step="1" />
          </label>
          <p class="hint">随机延迟是为了避免每天同一秒请求平台（风控）。设 0 表示准点跑。</p>
          <div class="sched-actions">
            <button class="btn primary" id="btnSaveSchedule">保存并生效</button>
            <span class="muted" id="schedEffective"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="modalTitle">日报</h2>
          <button class="btn tiny" id="btnCloseModal">关闭</button>
        </div>
        <div class="md" id="modalBody"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
