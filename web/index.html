<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 签到台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✓</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="aurora"></div>

    <header class="topbar">
      <div class="brand">
        <div class="logo">签</div>
        <div class="brand-text">
          <h1>AI 签到台</h1>
          <p class="sub" id="subline">加载中…</p>
        </div>
      </div>
      <div class="actions">
        <div class="next-run" id="nextRun"></div>
        <button id="btnReport" class="btn ghost" title="查看今日日报">日报</button>
        <button id="btnDry" class="btn ghost" title="只检查不点击">演练</button>
        <button id="btnRunAll" class="btn primary">
          <span class="dot"></span> 全部签到
        </button>
      </div>
    </header>

    <main>
      <section class="summary" id="summary"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>平台</h2>
          <div class="head-actions">
            <div class="seg" id="filterSeg">
              <button class="seg-btn active" data-filter="all">全部</button>
              <button class="seg-btn" data-filter="enabled">仅看启用</button>
            </div>
            <span class="muted" id="platformHint"></span>
          </div>
        </div>
        <div class="grid" id="platforms"></div>
      </section>

      <div class="columns">
        <section class="panel">
          <div class="panel-head">
            <h2>运行日志</h2>
            <div class="head-actions">
              <span class="live" id="liveBadge" hidden>● 实时</span>
              <button class="btn tiny" id="btnClearLog">清空</button>
            </div>
          </div>
          <pre class="log" id="log"><span class="muted">等待运行… 点击「全部签到」或单个平台的「签到」开始</span></pre>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>可接管客户端</h2>
            <button class="btn tiny" id="btnScanClients">重新扫描</button>
          </div>
          <div id="clients" class="clients"><span class="muted">扫描中…</span></div>
        </section>
      </div>
    </main>

    <footer class="foot">
      <span>数据来自 <code>data/results.jsonl</code> · 只监听 127.0.0.1</span>
      <span id="builtAt"></span>
    </footer>

    <div class="modal" id="modal">
      <div class="sheet">
        <div class="sheet-head">
          <h2 id="modalTitle">日报</h2>
          <button class="btn tiny" id="btnCloseModal">关闭</button>
        </div>
        <div class="md" id="modalBody"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
